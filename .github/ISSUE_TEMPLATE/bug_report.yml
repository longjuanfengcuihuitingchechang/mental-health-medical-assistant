name: Bug report
description: Report a reproducible defect without patient data or secrets
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include patient information, credentials, API keys, database files, or clinical conversation text."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed patient data, secrets, credentials, and tokens.
          required: true
