name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python, frontend and sensitive-data checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python source
        run: python -m compileall -q backend/app backend/scripts

      - name: Run unit and integration tests
        env:
          PYTHONPATH: backend
          DATABASE_PATH: ${{ runner.temp }}/mental-health-ci.db
          DATABASE_REQUIRED_DRIVE: ""
        run: python -m unittest discover -s backend/tests -v

      - name: Check frontend JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath fronts -Recurse -Filter "*.js" | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.FullName)" }
          }

      - name: Check sensitive-file boundaries
        shell: pwsh
        run: ./scripts/Test-SensitiveFiles.ps1

  container:
    name: Container build validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false
          tags: mental-health-medical-assistant:ci
          provenance: false

  release-gate:
    name: Production release approval gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, container]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    steps:
      - name: Confirm release prerequisites
        run: echo "Tests and container build passed; production approval granted."
