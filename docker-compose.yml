name: mental-health-assistant

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: mental-health-assistant:1.0.0
    init: true
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: container
      DATABASE_PATH: /data/mental_health.db
      DATABASE_REQUIRED_DRIVE: ""
      AUTH_PEPPER_FILE: /run/secrets/auth_pepper
      STATIC_FILES_PATH: /app/fronts
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
    volumes:
      - type: bind
        source: "${DATABASE_HOST_DIR:?Set DATABASE_HOST_DIR to the database directory}"
        target: /data
    secrets:
      - auth_pepper
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s

secrets:
  auth_pepper:
    file: "${AUTH_PEPPER_HOST_FILE:?Set AUTH_PEPPER_HOST_FILE to the pepper file}"
