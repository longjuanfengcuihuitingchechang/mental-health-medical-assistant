<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>心理健康智能医疗助手 - 注册</title>
  <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="shared/app.css">
</head>
<body class="min-h-screen bg-slate-50 px-4 py-10 text-slate-900">
  <main class="mx-auto w-full max-w-xl rounded-2xl border border-slate-200 bg-white p-8 shadow-lg">
    <header class="mb-8"><h1 class="text-3xl font-bold">创建账号</h1><p class="mt-2 text-sm text-slate-500">患者注册后立即启用；医生账号需管理员审批。</p></header>
    <form id="registerForm" class="grid gap-5 md:grid-cols-2" novalidate>
      <div><label for="reg-role" class="mb-2 block text-sm font-semibold">注册身份</label><select id="reg-role" class="w-full rounded-lg border px-3 py-2"><option value="patient">患者</option><option value="doctor">医生（需审批）</option></select></div>
      <div><label for="fullname" class="mb-2 block text-sm font-semibold">姓名</label><input id="fullname" required class="w-full rounded-lg border px-3 py-2"></div>
      <div><label for="id-card" class="mb-2 block text-sm font-semibold">身份证号</label><input id="id-card" required autocomplete="off" class="w-full rounded-lg border px-3 py-2"></div>
      <div><label for="phone" class="mb-2 block text-sm font-semibold">手机号</label><input id="phone" required autocomplete="tel" class="w-full rounded-lg border px-3 py-2"></div>
      <div><label for="contact" class="mb-2 block text-sm font-semibold">电子邮箱</label><input id="contact" type="email" required autocomplete="email" class="w-full rounded-lg border px-3 py-2"></div>
      <div><label for="password" class="mb-2 block text-sm font-semibold">密码</label><input id="password" type="password" required autocomplete="new-password" class="w-full rounded-lg border px-3 py-2"></div>
      <div><label for="confirm-password" class="mb-2 block text-sm font-semibold">确认密码</label><input id="confirm-password" type="password" required autocomplete="new-password" class="w-full rounded-lg border px-3 py-2"></div>
      <div id="doctorFields" class="hidden space-y-5 md:col-span-2 md:grid md:grid-cols-2 md:gap-5 md:space-y-0"><div><label for="department" class="mb-2 block text-sm font-semibold">科室</label><input id="department" class="w-full rounded-lg border px-3 py-2"></div><div><label for="professional-title" class="mb-2 block text-sm font-semibold">职称</label><input id="professional-title" class="w-full rounded-lg border px-3 py-2"></div></div>
      <div class="md:col-span-2"><button type="submit" class="w-full rounded-lg bg-teal-700 px-4 py-3 font-semibold text-white">注册</button><p class="mt-4 text-center text-sm"><a class="text-teal-700" href="index.html">返回登录</a></p></div>
    </form>
  </main>
  <script src="shared/api.js"></script><script src="shared/auth-pages.js"></script>
</body>
</html>
